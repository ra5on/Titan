name: Titan image
on:
  workflow_dispatch:
  push:
    branches: [titan-0.1, main]
    paths:
      - 'packages/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
permissions:
  contents: read
concurrency:
  group: titan-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Reserve space on the disposable runner
        run: sudo rm -rf /usr/local/lib/android /usr/local/.ghcup /opt/ghc /usr/share/dotnet
      - name: Install shared server build dependencies
        working-directory: packages/umbreld
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build web interface
        working-directory: packages/ui
        run: |
          npm ci
          NODE_OPTIONS=--max-old-space-size=4096 npm run build
      - uses: docker/setup-buildx-action@v3
      - name: Build disk image and update bundle
        run: packages/os/build-titan.sh
      - name: Archive release metadata for review
        uses: actions/upload-artifact@v4
        with:
          name: titan-release-metadata
          path: |
            packages/os/build/titan-*/manifest.txt
            packages/os/build/titan-*/release-notes.md
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: titan-amd64
          path: packages/os/build/titan-*/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Boot from NVMe and capture the web interface
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf tshark
          if [ -c /dev/kvm ]; then sudo setfacl -m u:"$USER":rw /dev/kvm; fi
          packages/os/test-titan-image.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: titan-boot-test
          path: |
            packages/os/build/boot-test/*.png
            packages/os/build/boot-test/serial.log
            packages/os/build/boot-test/network-hosts.txt
          if-no-files-found: ignore
