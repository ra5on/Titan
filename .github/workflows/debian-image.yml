name: Titan Debian A/B image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/debian-image.yml'
      - 'scripts/build-debian-ab-image.sh'
permissions:
  contents: write
concurrency:
  group: titan-debian-ab-image
  cancel-in-progress: true
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TITAN_SYSTEM_VERSION: 0.4.13-alpha.1
      TITAN_UPDATE_ONLY: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Prepare disposable image builder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libguestfs-tools qemu-system-x86 qemu-utils ovmf xz-utils smbclient rauc grub2-common python3-yaml
          sudo apt-get remove -y passt
          sudo chmod a+r /boot/vmlinuz-*
          if test -c /dev/kvm; then sudo chown "$(id -u):$(id -g)" /dev/kvm; fi
      - name: Debian regression tests
        run: |
          python3 -m unittest discover -s tests
          for script in image/debian/ab/*.sh scripts/*signing.sh scripts/build-debian*.sh scripts/smoke-image.sh; do bash -n "$script"; done
      - name: JavaScript and UI regression tests
        run: |
          for task_js in titan/web/*.js; do node --check "$task_js"; done
          for task_test in tests/*.cjs; do node "$task_test"; done
      - name: Prepare signing identity
        env:
          TITAN_SIGNING_KEY: ${{ secrets.TITAN_SIGNING_KEY }}
        run: bash scripts/prepare-system-signing.sh
      - name: Build signed Debian A/B system with checked full-size filesystems
        run: bash scripts/build-debian-ab-image.sh --disposable-runner
      - name: Boot, HTTPS, UEFI and authenticated VNC checks on disposable overlay
        run: bash scripts/smoke-image.sh "dist/debian-image/titan-$TITAN_SYSTEM_VERSION-amd64.img" --debian-ab
      - name: Fetch verified published 0.4.6 baseline
        run: |
          mkdir -p dist/debian-baseline
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            https://github.com/ra5on/Titan/releases/download/v0.4.6-alpha.1/titan-0.4.6-alpha.1-amd64.img.xz \
            -o dist/debian-baseline/baseline.img.xz
          echo '78bc547f20735a55fa40680f82a966e93c248a78b64052c4272667a13bbf2e01  dist/debian-baseline/baseline.img.xz' | sha256sum --check
          xz -dc dist/debian-baseline/baseline.img.xz | dd of=dist/debian-baseline/baseline.img conv=sparse status=none
          rm dist/debian-baseline/baseline.img.xz
      - name: Published baseline to candidate update, rollback and failure recovery
        run: python3 scripts/smoke-debian-ab.py "dist/debian-image/titan-$TITAN_SYSTEM_VERSION-amd64.img" "dist/debian-image/titan-$TITAN_SYSTEM_VERSION-amd64.raucb" --baseline-image dist/debian-baseline/baseline.img --baseline-version 0.4.6-alpha.1 --confirm-disposable-guest
      - name: Publish tested signed system update
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-debian-system.sh
      - name: Remove temporary private signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/titan-signing"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: titan-debian-ab-diagnostics
          path: |
            dist/debian-image/boot-status
            dist/debian-image/boot-console.log
            dist/debian-image/boot-http-error.txt
            dist/debian-image/runtime-test.json
            dist/debian-image/ab-test.json
            dist/debian-image/ab-console.log
          retention-days: 7
