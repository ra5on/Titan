name: Titan Debian system release
# Build Titan 0.6.0: verified Debian sources, with isolated keyring regression fixtures.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/debian-image.yml']
permissions:
  contents: write
# Both dispatchers use this queue so version allocation cannot race publication.
concurrency:
  group: titan-debian-release-queue
  # Use this explicit flag only after confirming the superseded run has not
  # reached publication. Ordinary pushes and scheduled maintenance stay queued.
  cancel-in-progress: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[supersede-unpublished-release]') }}
jobs:
  hold:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[hold-release]')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Hold image publication while the requested application changes are prepared
        run: echo 'Image publication is held for the next reviewed source commit.'
  identity:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[hold-release]')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.identity.outputs.version }}
      app_version: ${{ steps.identity.outputs.app_version }}
      app_stage: ${{ steps.identity.outputs.app_stage }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Allocate immutable feature release identity
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/debian-maintenance.py titan
  build:
    needs: identity
    uses: ./.github/workflows/debian-system-build.yml
    with:
      version: ${{ needs.identity.outputs.version }}
      source_ref: ${{ github.sha }}
      app_version: ${{ needs.identity.outputs.app_version }}
      app_stage: ${{ needs.identity.outputs.app_stage }}
      update_kind: titan
      include_image: true
      initial_image: true
    secrets:
      TITAN_SIGNING_KEY: ${{ secrets.TITAN_SIGNING_KEY }}
