name: Titan Debian system release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/debian-image.yml'
      - '.github/workflows/debian-system-build.yml'
      - '.github/workflows/app-packages.yml'
      - 'titan/**'
      - 'image/debian/**'
      - 'packaging/debian/**'
      - 'scripts/build-debian*.py'
      - 'scripts/build-debian*.sh'
      - 'scripts/prepare-system-build.py'
      - 'scripts/debian-maintenance.py'
      - 'scripts/debian-package-state.py'
      - 'scripts/prepare-maintenance-baseline.sh'
      - 'scripts/prepare-debian-rootfs.sh'
      - 'scripts/prepare-system-signing.sh'
      - 'scripts/system-release-metadata.py'
      - 'scripts/validate-system-evidence.py'
      - 'scripts/publish-debian-system.sh'
      - 'scripts/smoke-image.sh'
      - 'scripts/smoke-runtime.py'
      - 'scripts/smoke-debian-ab.py'
      - 'scripts/smoke-app-packages.py'
      - 'scripts/smoke-office-gateway.py'
permissions:
  contents: write
# Both dispatchers use this queue so version allocation cannot race publication.
concurrency:
  group: titan-debian-release-queue
  cancel-in-progress: false
jobs:
  identity:
    if: github.event_name != 'push' || github.event.head_commit.message != 'Initialize Titan eigenbau with BigBear stacks'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.identity.outputs.version }}
      app_version: ${{ steps.identity.outputs.app_version }}
      app_stage: ${{ steps.identity.outputs.app_stage }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Allocate immutable feature release identity
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/debian-maintenance.py titan
  build:
    needs: identity
    uses: ./.github/workflows/debian-system-build.yml
    with:
      version: ${{ needs.identity.outputs.version }}
      source_ref: ${{ github.sha }}
      app_version: ${{ needs.identity.outputs.app_version }}
      app_stage: ${{ needs.identity.outputs.app_stage }}
      update_kind: titan
    secrets:
      TITAN_SIGNING_KEY: ${{ secrets.TITAN_SIGNING_KEY }}
