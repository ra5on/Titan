name: Native app runtime checks
on:
  push:
    branches: [main]
    paths: ['titan/**', 'scripts/smoke-*.py', 'scripts/ci-*.py', 'scripts/ci-ubuntu-dependencies.sh', 'tests/fixtures/runtime-stack-store.json', '.github/workflows/bigbear.yml', '.github/workflows/app-packages.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-apps:
    uses: ./.github/workflows/app-packages.yml
    with:
      source_ref: ${{ github.sha }}
