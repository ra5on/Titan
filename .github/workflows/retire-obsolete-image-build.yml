name: Retire obsolete bootstrap image build
on:
  push:
    branches: [main]
    paths: ['.github/workflows/retire-obsolete-image-build.yml']
permissions:
  actions: write
  contents: read
jobs:
  retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Cancel only the known obsolete unpublished bootstrap run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          base = 'https://api.github.com/repos/ra5on/Titan'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(base + path, headers=headers), timeout=30) as response:
                  return json.load(response)
          run = get('/actions/runs/37525477219')
          assert run['head_sha'] == '7b6f4d6cdcd8555c64138be32223945b0c6b58ee'
          assert run['name'] == 'Titan Debian system release'
          if run['status'] != 'completed':
              assert get('/releases?per_page=1') == [], 'Only the unpublished bootstrap may be cancelled.'
              jobs = get('/actions/runs/37525477219/jobs')['jobs']
              assert not any(step['name'] == 'Publish only tested signed update bundle' and step['status'] != 'pending'
                             for job in jobs for step in job.get('steps', [])), 'Publication has already started.'
              request = urllib.request.Request(base + '/actions/runs/37525477219/cancel', headers=headers, data=b'', method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  assert response.status == 202
              print('Cancellation requested for the obsolete bootstrap run.')
          else:
              print('Obsolete bootstrap run has already ended.')
          PY
