name: App package runtime checks
on:
  workflow_call:
    inputs:
      source_ref:
        description: Frozen application commit whose packages are installed in this build
        required: false
        type: string
        default: ''
  workflow_dispatch:
permissions:
  contents: read
env:
  # Same accepted snapshot as the main BigBear lifecycle workflow.
  BIGBEAR_REVISION: f5e7cb7e4c5e01180d44fc459c65ae1c37c2ac20
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        package: [bigbear:immich, bigbear:adguard-home, bigbear:nextcloud]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Install YAML parser
        run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - name: Complete package startup, connection and restart
        run: sudo --preserve-env=GITHUB_ACTIONS python3 scripts/smoke-app-packages.py '${{ matrix.package }}' --confirm-disposable-runner --bigbear-revision "$BIGBEAR_REVISION"
