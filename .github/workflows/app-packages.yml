name: App package runtime checks
on:
  workflow_call:
    inputs:
      source_ref:
        description: Frozen application commit whose packages are installed in this build
        required: false
        type: string
        default: ''
  workflow_dispatch:
permissions:
  contents: read
env:
  # Frozen legacy applications keep their accepted catalog snapshot.
  BIGBEAR_REVISION: f5e7cb7e4c5e01180d44fc459c65ae1c37c2ac20
jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - name: Check out frozen application
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Check out current CI builder
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .titan-ci-builder
          persist-credentials: false
      - name: Select frozen application acceptance contract
        id: mode
        run: python3 .titan-ci-builder/scripts/ci-app-source.py . >> "$GITHUB_OUTPUT"

  legacy-package:
    needs: source
    if: needs.source.outputs.mode == 'legacy'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        package: [bigbear:immich, bigbear:adguard-home, bigbear:nextcloud]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Check out current CI builder
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .titan-ci-builder
          persist-credentials: false
      - name: Install YAML parser
        run: bash .titan-ci-builder/scripts/ci-ubuntu-dependencies.sh python3-yaml e2fsprogs util-linux
      - name: Complete package startup, connection and restart
        run: sudo --preserve-env=GITHUB_ACTIONS python3 scripts/smoke-app-packages.py '${{ matrix.package }}' --confirm-disposable-runner --bigbear-revision "$BIGBEAR_REVISION" ${{ matrix.package == 'bigbear:nextcloud' && '--app-backup-smoke' || '' }}

  legacy-cloudflared-web:
    needs: source
    if: needs.source.outputs.mode == 'legacy'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        auth: [disabled, password]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Check out current CI builder
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .titan-ci-builder
          persist-credentials: false
      - name: Disposable LAN, firewall and Caddy dependencies
        run: bash .titan-ci-builder/scripts/ci-ubuntu-dependencies.sh python3-yaml firewalld caddy
      - name: Generated Caddy configurations and real Titan tunnel proxy acceptance
        run: |
          python3 -m unittest discover -s tests -p test_web_access_caddy.py -v
          python3 -m unittest discover -s tests -p 'test_remote_access*.py' -v
      - name: Isolated LAN client and active firewalld
        run: |
          sudo systemctl start firewalld
          sudo ip netns add titan-ci-client
          sudo ip link add titan-ci0 type veth peer name eth0 netns titan-ci-client
          sudo ip addr add 10.254.254.1/30 dev titan-ci0
          sudo ip link set titan-ci0 up
          sudo ip netns exec titan-ci-client ip addr add 10.254.254.2/30 dev eth0
          sudo ip netns exec titan-ci-client ip link set lo up
          sudo ip netns exec titan-ci-client ip link set eth0 up
          sudo firewall-cmd --zone=home --add-interface=titan-ci0
      - name: Cloudflared Host network, HTTP, LAN firewall and lifecycle (${{ matrix.auth }})
        run: sudo --preserve-env=GITHUB_ACTIONS python3 scripts/smoke-app-packages.py bigbear:cloudflared-web --confirm-disposable-runner --bigbear-revision "$BIGBEAR_REVISION" --cloudflared-auth '${{ matrix.auth }}'
      - name: Remove isolated test LAN
        if: always()
        run: |
          sudo ip netns del titan-ci-client || true
          sudo ip link del titan-ci0 || true

  cloudflared-token:
    needs: source
    if: needs.source.outputs.mode == 'native'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out frozen application
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Check out current CI builder
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .titan-ci-builder
          persist-credentials: false
      - name: Install native app and real proxy dependencies
        run: bash .titan-ci-builder/scripts/ci-ubuntu-dependencies.sh python3-yaml iproute2 util-linux caddy
      - name: Real Caddy configuration and tunnel proxy acceptance
        run: |
          python3 -m unittest discover -s tests -p test_web_access_caddy.py -v
          python3 -m unittest discover -s tests -p test_remote_access_proxy.py -v
      - name: Native Cloudflare installation steps, private token and failed-auth recovery
        run: sudo --preserve-env=GITHUB_ACTIONS python3 scripts/smoke-cloudflare-token.py --confirm-disposable-runner

  compose-fixture:
    needs: source
    if: needs.source.outputs.mode == 'native'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out frozen application
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Check out current CI builder
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .titan-ci-builder
          persist-credentials: false
      - name: Install isolated Compose acceptance dependencies
        run: bash .titan-ci-builder/scripts/ci-ubuntu-dependencies.sh python3-yaml e2fsprogs util-linux
      - name: Own multi-container Compose lifecycle and data preservation
        run: sudo --preserve-env=GITHUB_ACTIONS python3 .titan-ci-builder/scripts/smoke-compose-fixture.py --source-root "$GITHUB_WORKSPACE" --confirm-disposable-runner
