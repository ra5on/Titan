<svg xmlns="http://www.w3.org/2000/svg" width="460" height="320" viewBox="0 0 460 320" fill="none">
  <defs>
    <linearGradient id="mica" x1="0" y1="0" x2="460" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20242c"/>
      <stop offset="1" stop-color="#1b1d22"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="34" gradientUnits="userSpaceOnUse">
      <stop stop-color="#171a20"/>
      <stop offset="1" stop-color="#14161b"/>
    </linearGradient>
    <linearGradient id="folder-back" x1="0" y1="0" x2="0" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f2b33d"/>
      <stop offset="1" stop-color="#d9911c"/>
    </linearGradient>
    <linearGradient id="folder-front" x1="0" y1="14" x2="0" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#ffc83d"/>
    </linearGradient>
    <clipPath id="window"><rect x=".5" y=".5" width="459" height="319" rx="9"/></clipPath>
    <!-- Windows 11's folder: a back with its tab, and a lighter front -->
    <g id="folder-icon">
      <path d="M2 7.5A3.5 3.5 0 0 1 5.5 4h15.3c1 0 1.9.4 2.6 1.1L27 9h27.5A3.5 3.5 0 0 1 58 12.5v33a3.5 3.5 0 0 1-3.5 3.5h-49A3.5 3.5 0 0 1 2 45.5Z" fill="url(#folder-back)"/>
      <path d="M2 18.5A3.5 3.5 0 0 1 5.5 15h49a3.5 3.5 0 0 1 3.5 3.5v27a3.5 3.5 0 0 1-3.5 3.5h-49A3.5 3.5 0 0 1 2 45.5Z" fill="url(#folder-front)"/>
      <path d="M5.5 15.5h49" stroke="#fff3c4" stroke-opacity=".7"/>
    </g>
    <!-- Titan's mark, as a cloud provider shows in the navigation pane -->
    <g id="titan-mark">
      <path transform="scale(.145833)" fill="#CBD7F0" d="M7 14H65C54 19 45 27 39 38H7Z M83 14H89V38H72C64 38 60 43 60 51V79Q60 84 55 84H36V61C36 37 52 20 83 14Z"/>
    </g>
  </defs>
  <g clip-path="url(#window)">
    <path fill="url(#mica)" d="M0 0h460v320H0z"/>

    <!-- Tabs -->
    <path fill="url(#chrome)" d="M0 0h460v34H0z"/>
    <path fill="#262a31" d="M8 34V13a7 7 0 0 1 7-7h146a7 7 0 0 1 7 7v21Z"/>
    <use href="#titan-mark" x="18" y="13"/>
    <path d="m151 16 6 6m0-6-6 6" stroke="#c9ccd3" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M186 13.5v9m-4.5-4.5h9" stroke="#c9ccd3" stroke-width="1.2" stroke-linecap="round"/>
    <g stroke="#c9ccd3" stroke-width="1.1" stroke-linecap="round">
      <path d="M348 18h10"/>
      <rect x="384" y="13" width="9.5" height="9.5" rx="1.5"/>
      <path d="m421 13 9.5 9.5m0-9.5-9.5 9.5"/>
    </g>

    <!-- Address bar -->
    <path fill="#262a31" d="M0 34h460v38H0z"/>
    <g stroke="#d7dae0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 53h10m-5-5-5 5 5 5"/>
      <path d="M50 53h10m-5-5 5 5-5 5" opacity=".35"/>
      <path d="M80 58V48m-5 5 5-5 5 5"/>
      <path d="M109.5 49.2a5.5 5.5 0 1 0 1.3 4.8m-1.3-4.8V46m0 3.2h-3.2"/>
    </g>
    <rect x="126" y="42.5" width="212" height="22" rx="4" fill="#1d2026" stroke="#3a3e46"/>
    <use href="#titan-mark" x="134" y="46.5"/>
    <path d="m156 50.5 3 3-3 3" stroke="#a9adb5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="346" y="42.5" width="106" height="22" rx="4" fill="#1d2026" stroke="#3a3e46"/>
    <g stroke="#a9adb5" stroke-width="1.2" stroke-linecap="round"><circle cx="358.5" cy="52.5" r="3.6"/><path d="m361.2 55.2 2.8 2.8"/></g>

    <!-- Command bar -->
    <path fill="#262a31" d="M0 72h460v34H0z"/>
    <path stroke="#fff" stroke-opacity=".06" d="M0 106h460"/>
    <rect x="10" y="78" width="58" height="22" rx="4" fill="#ffffff" fill-opacity=".05"/>
    <g stroke="#60cdff" stroke-width="1.3" stroke-linecap="round"><circle cx="22" cy="89" r="5.5"/><path d="M22 86.4v5.2M19.4 89h5.2"/></g>
    <path d="m58 87.5 2.5 2.5 2.5-2.5" stroke="#c9ccd3" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    <g stroke="#c9ccd3" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
      <!-- cut, copy, paste, rename, share, delete -->
      <path d="m84 82 7 10m0-10-7 10"/><circle cx="83.5" cy="94.5" r="2"/><circle cx="91.5" cy="94.5" r="2"/>
      <rect x="106" y="84" width="8" height="10" rx="1.5"/><path d="M109 84v-1.5a1.5 1.5 0 0 1 1.5-1.5h5a1.5 1.5 0 0 1 1.5 1.5V90"/>
      <rect x="128" y="83" width="10" height="12" rx="1.5"/><path d="M130.5 83v-1h5v1M131 88h4m-4 3h4"/>
      <rect x="150" y="84" width="12" height="9" rx="1.5"/><path d="M153 87.5h6"/>
      <path d="M174 90v3.5a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V90m-5-7v8m-3-5 3-3 3 3"/>
      <path d="M196 85h11m-8.5 0v-1.5a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1V85m-6 0 .7 9a1 1 0 0 0 1 1h3.6a1 1 0 0 0 1-1l.7-9"/>
    </g>
    <path stroke="#fff" stroke-opacity=".1" d="M218 80v18"/>

    <!-- Navigation pane -->
    <path stroke="#fff" stroke-opacity=".06" d="M136 106v214"/>
    <g stroke="#c9ccd3" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 125.5 25 120l6 5.5V131a1 1 0 0 1-1 1h-3v-4h-4v4h-3a1 1 0 0 1-1-1Z"/>
      <rect x="19" y="143" width="12" height="10" rx="2"/><path d="m19.5 151 3.5-3.5 2.5 2.5 1.5-1.5 3 3"/><circle cx="27.5" cy="146" r=".9"/>
    </g>
    <rect x="6" y="157" width="124" height="24" rx="4" fill="#fff" fill-opacity=".09"/>
    <rect x="6" y="163" width="3" height="12" rx="1.5" fill="#4cc2ff"/>
    <use href="#titan-mark" x="18" y="162"/>
    <path stroke="#fff" stroke-opacity=".08" d="M14 189h108"/>
    <g stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="19" y="199" width="12" height="9" rx="1.5" stroke="#60cdff"/><path d="M23 211h4" stroke="#60cdff"/>
      <path d="M25 222v8m-3.5-3.5L25 230l3.5-3.5M19.5 233h11" stroke="#6ccb5f"/>
      <path d="M21 245a1.5 1.5 0 0 1 1.5-1.5h5L30 246v10.5a1.5 1.5 0 0 1-1.5 1.5h-6A1.5 1.5 0 0 1 21 256.5Z" stroke="#c9ccd3"/>
      <rect x="19" y="266" width="12" height="10" rx="2" stroke="#4cc2ff"/><path d="m19.5 274 3.5-3.5 2.5 2.5 1.5-1.5 3 3" stroke="#4cc2ff"/>
    </g>

    <g font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
      <text x="38" y="24.5" fill="#f1f2f4" font-size="11.5">Titan</text>
      <text x="166" y="57" fill="#e6e8ec" font-size="11">Titan</text>
      <text x="372" y="56.5" fill="#8f939b" font-size="10">Search Titan</text>
      <text x="32" y="93" fill="#e6e8ec" font-size="11">New</text>
      <g fill="#e6e8ec" font-size="11">
        <text x="40" y="130">Home</text>
        <text x="40" y="153">Gallery</text>
        <text x="40" y="173" fill="#fff" font-weight="600">Titan</text>
        <text x="40" y="208">Desktop</text>
        <text x="40" y="231">Downloads</text>
        <text x="40" y="254">Documents</text>
        <text x="40" y="276">Pictures</text>
      </g>
      <g fill="#e6e8ec" font-size="11" text-anchor="middle">
        <text x="186" y="186">Documents</text>
        <text x="274" y="186">Photos</text>
        <text x="362" y="186">Projects</text>
        <text x="186" y="286">Music</text>
        <text x="274" y="286">Videos</text>
        <text x="362" y="286">Archive</text>
      </g>
      <text x="146" y="312" fill="#8f939b" font-size="10">6 items</text>
    </g>

    <!-- Folders, large icons -->
    <use href="#folder-icon" x="156" y="120"/>
    <use href="#folder-icon" x="244" y="120"/>
    <use href="#folder-icon" x="332" y="120"/>
    <use href="#folder-icon" x="156" y="220"/>
    <use href="#folder-icon" x="244" y="220"/>
    <use href="#folder-icon" x="332" y="220"/>
  </g>
  <rect x=".5" y=".5" width="459" height="319" rx="9" stroke="#fff" stroke-opacity=".1"/>
</svg>
