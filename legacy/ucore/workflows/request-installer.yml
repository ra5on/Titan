name: Request installation image
on:
  push:
    branches: ['installer/v*']
permissions:
  contents: read
  actions: write
concurrency:
  group: titan-installer-request
  cancel-in-progress: false
jobs:
  request:
    if: github.repository == 'ra5on/Titan'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Request the exact explicitly selected installer release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          task_version="$(python3 -c 'from titan import __version__; print(__version__)')"
          test "$GITHUB_REF_NAME" = "installer/v$task_version"
          task_head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq '.object.sha')"
          test "$task_head" = "$GITHUB_SHA"
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f installer_image=true
          printf 'Explicit installation build requested for %s at %s. Normal releases remain update-only.\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
