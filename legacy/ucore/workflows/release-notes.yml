name: Release notes
on:
  push:
    branches: [main]
    paths:
      - 'docs/RELEASE-*.md'
      - '.github/workflows/release-notes.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: titan-release-notes
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Add verified direct IMG downloads to existing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYNOTES'
          import json, re, subprocess, tempfile
          from pathlib import Path
          from scripts.sign_release import require_public_release

          repo = 'ra5on/Titan'
          releases = json.loads(subprocess.check_output([
              'gh', 'api', f'repos/{repo}/releases?per_page=100'], text=True))
          begin, end = '<!-- titan-img-download -->', '<!-- /titan-img-download -->'
          key = Path('packaging/release-public.pem').resolve()
          for release in releases:
              tag = release.get('tag_name', '')
              if release.get('draft') or not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:-(?:alpha|beta)\.[0-9]+)?', tag):
                  continue
              if not Path(f'docs/RELEASE-{tag[1:]}.md').is_file():
                  continue
              assets = {item['name']: item for item in release.get('assets', [])}
              if 'manifest.json' not in assets or 'manifest.json.sig' not in assets:
                  continue
              with tempfile.TemporaryDirectory(prefix='titan-notes-') as temporary:
                  subprocess.run(['gh', 'release', 'download', tag, '--repo', repo,
                                  '--pattern', 'manifest.json*', '--dir', temporary], check=True)
                  manifest_path = Path(temporary) / 'manifest.json'
                  verified = subprocess.run(['openssl', 'pkeyutl', '-verify', '-rawin', '-pubin',
                                             '-inkey', str(key), '-in', str(manifest_path),
                                             '-sigfile', str(Path(temporary) / 'manifest.json.sig')],
                                            capture_output=True)
                  if verified.returncode:
                      print(f'Skipping {tag}: manifest signature is not trusted.')
                      continue
                  manifest = json.loads(manifest_path.read_text())
              try:
                  require_public_release(manifest)
              except ValueError:
                  print(f'Skipping {tag}: required image tests did not pass.')
                  continue
              if manifest.get('publication') == 'update-only':
                  if manifest.get('version') != tag[1:]:
                      raise SystemExit(f'{tag}: update version does not match the signed manifest.')
                  print(f'Skipping {tag}: signed update-only release has no installation download.')
                  continue
              name = f'titan-{tag[1:]}-x86_64.img.xz'
              expected = f'https://github.com/{repo}/releases/download/{tag}/{name}'
              asset = assets.get(name)
              if (manifest.get('asset') != name or manifest.get('version') != tag[1:]
                  or not asset or asset.get('browser_download_url') != expected
                  or asset.get('size') != manifest.get('size')):
                  raise SystemExit(f'{tag}: download does not match the signed manifest.')
              body = release.get('body') or ''
              body = re.sub(re.escape(begin) + r'.*?' + re.escape(end) + r'\s*', '', body,
                            flags=re.DOTALL)
              prefix = (f'{begin}\n**[Systemimage direkt herunterladen (.img.xz)]({expected})**\n\n'
                        f'[Signiertes Manifest](https://github.com/{repo}/releases/download/{tag}/manifest.json)'
                        f' · [Installation](https://github.com/{repo}/blob/main/docs/INSTALL.md)\n{end}\n\n')
              updated = prefix + body
              if updated == (release.get('body') or ''):
                  continue
              # Only the description changes; signed media and evidence stay intact.
              subprocess.run(['gh', 'api', '--method', 'PATCH',
                              f'repos/{repo}/releases/{release["id"]}', '--input', '-'],
                             input=json.dumps({'body': updated}), text=True, check=True,
                             stdout=subprocess.DEVNULL)
              print(f'Added verified IMG link to {tag}.')
          PYNOTES
