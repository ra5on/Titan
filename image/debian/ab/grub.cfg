set timeout=4
set default=2
search --no-floppy --label TITAN-BOOT --set=titan_boot
set ORDER="A B"
set A_OK=1
set B_OK=0
set A_TRY=0
set B_TRY=0
load_env --file=($titan_boot)/grubenv
for slot in $ORDER; do
    if [ "$slot" = "A" -a "$A_OK" = "1" -a "$A_TRY" = "0" ]; then
        set default=0
        set A_TRY=1
        break
    fi
    if [ "$slot" = "B" -a "$B_OK" = "1" -a "$B_TRY" = "0" ]; then
        set default=1
        set B_TRY=1
        break
    fi
done
save_env --file=($titan_boot)/grubenv ORDER A_OK B_OK A_TRY B_TRY
menuentry 'Titan · System A' {
    search --no-floppy --label TITAN-A --set=root
    linux /vmlinuz root=LABEL=TITAN-A rw rauc.slot=A console=tty0 console=ttyS0,115200 panic=60
    initrd /initrd.img
}
menuentry 'Titan · System B' {
    search --no-floppy --label TITAN-B --set=root
    linux /vmlinuz root=LABEL=TITAN-B rw rauc.slot=B console=tty0 console=ttyS0,115200 panic=60
    initrd /initrd.img
}
menuentry 'Titan · Kein bestätigtes System: Diagnose erforderlich' {
    echo 'Kein gesunder Systemstand verfügbar. System A oder B nur zur Diagnose manuell wählen.'
    sleep --interruptible 300
}
